<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cartógrafo de Asentamientos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --line: #e4e0d6;
  --text: #24211c;
  --muted: #7a746a;
  --accent: #b5552f;
  --accent-soft: #f3e3da;
  --stage: #ddd6c4;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .4; cursor: not-allowed; }

.topbar {
  height: 52px; display: flex; align-items: center; gap: 20px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.brand-mark { width: 14px; height: 14px; background: var(--accent); border-radius: 3px; display: inline-block; }
.steps { display: flex; gap: 2px; background: var(--bg); padding: 3px; border-radius: 8px; }
.steps button { padding: 6px 12px; border-radius: 6px; color: var(--muted); display: flex; gap: 8px; align-items: center; font-weight: 500; }
.steps button span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid currentColor; display: inline-grid; place-items: center; font-size: 11px; }
.steps button.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.steps button.active span { background: var(--text); color: #fff; border-color: var(--text); }
.spacer { flex: 1; }
.actions { display: flex; align-items: center; gap: 6px; }
.actions .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
.icon { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; }
.icon:hover:not(:disabled) { background: var(--bg); }
.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ghost, .primary { height: 32px; padding: 0 12px; border-radius: 6px; font-weight: 500; }
.ghost { border: 1px solid var(--line); background: var(--surface); }
.ghost:hover { border-color: #cfc9bc; }
.primary { background: var(--text); color: #fff; }
.primary:hover { background: #3b362e; }
.accent { background: var(--accent); color: #fff; }

.layout { display: flex; height: calc(100% - 52px); }
.panel { width: 284px; flex: none; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
.panel section { padding: 16px; border-bottom: 1px solid var(--line); }
.panel h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
.panel p { margin: 0 0 8px; color: var(--muted); line-height: 1.5; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 2px 7px; border-radius: 8px; border: 1px solid var(--line); font-size: 10.5px; font-weight: 500; color: #4b463e; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool:hover { border-color: #cfc9bc; }
.tool.active { border-color: var(--text); background: var(--text); color: #fff; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.elem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 14px; }
.elem-grid .tool.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.row:last-child { margin-bottom: 0; }
.row label { font-weight: 500; }
.row output { color: var(--muted); min-width: 52px; text-align: right; }
.slider { display: block; margin-bottom: 14px; }
.slider:last-child { margin-bottom: 0; }
.slider .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.slider .top span:first-child { font-weight: 500; }
.slider .top span:last-child { color: var(--muted); }
input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 18px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--line); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--text); margin-top: -5.5px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--line); border-radius: 2px; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 0; }
.seg { display: flex; background: var(--bg); padding: 3px; border-radius: 7px; gap: 2px; margin-bottom: 14px; }
.seg button { flex: 1; padding: 6px; border-radius: 5px; color: var(--muted); font-weight: 500; }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; margin-bottom: 10px; }
.check input { accent-color: var(--text); width: 15px; height: 15px; margin: 0; }
.panel .grow { flex: 1; border-bottom: 0; }
.nav { display: flex; gap: 8px; padding: 16px; border-top: 1px solid var(--line); }
.nav button { flex: 1; height: 36px; }
.warn { background: var(--accent-soft); color: #7b371b; border-radius: 6px; padding: 10px 12px; line-height: 1.45; margin: 0 16px 0; font-size: 12px; }
.keys { font-size: 12px; color: var(--muted); line-height: 1.7; }
.keys kbd { font: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); color: var(--text); }
.btn-block { width: 100%; height: 34px; margin-top: 4px; }
.seed { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

.stage { flex: 1; position: relative; background: var(--stage); overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
.hint { position: absolute; left: 16px; top: 14px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #4b463e; pointer-events: none; max-width: 70%; }
.hint:empty { display: none; }
.busy { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; display: none; }
.busy.on { display: block; }
.zoom { position: absolute; right: 16px; top: 14px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.zoom button { width: 32px; height: 32px; font-size: 16px; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--bg); }
.stats { position: absolute; right: 16px; bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; gap: 22px; }
.stats:empty { display: none; }
.stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat .info { cursor: help; border-bottom: 1px dotted var(--muted); }
@media (max-width: 720px) {
  .topbar { gap: 8px; overflow-x: auto; }
  .brand { display: none; }
  .layout { flex-direction: column-reverse; }
  .panel { width: 100%; height: 42%; border-right: 0; border-top: 1px solid var(--line); }
  .stats { left: 16px; right: auto; }
}

#overlay, #densImg, #distImg { pointer-events: none; }
.selname { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.selname span { font-weight: 400; font-size: 12px; color: var(--muted); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 12px; }
.btn-row button { height: 32px; }
.danger { color: #9b3517; }
.danger:hover { border-color: #d9a48e; background: #fbefe9; }
.panel p.small { font-size: 12px; margin: 0; }

.theme-wrap { position: relative; }
.theme-panel { position: absolute; right: 0; top: 40px; z-index: 20; width: 300px; max-height: calc(100vh - 80px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 8px 24px rgba(40, 30, 20, .12); }
.theme-panel[hidden] { display: none; }
.theme-list { display: grid; gap: 2px; }
.theme-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; text-align: left; font-weight: 500; }
.theme-item:hover { background: var(--bg); }
.theme-item.active { background: var(--text); color: #fff; }
.sw { display: inline-flex; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.12); flex: none; }
.sw i { width: 12px; height: 18px; display: block; }
.theme-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 12px 6px 6px; border-top: 1px solid var(--line); margin-top: 8px; }
.theme-custom label { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
.theme-custom input[type=color] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; flex: none; }
.theme-actions { display: flex; align-items: center; gap: 8px; padding: 8px 6px 4px; font-size: 12px; color: var(--muted); }
.theme-actions select { flex: 1; font: inherit; font-size: 12px; padding: 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); }

.menu-panel { position: absolute; right: 0; top: 40px; z-index: 20; width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(40, 30, 20, .12); }
.menu-panel[hidden] { display: none; }
.menu-panel button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; }
.menu-panel button:hover { background: var(--bg); }
.menu-panel b { display: block; font-weight: 500; }
.menu-panel span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.menu-panel hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.dist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 14px; }
.dist-grid button { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; font-weight: 500; }
.dist-grid button.active { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.dist-grid i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-weight: 500; }
.field select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); }

  </style>
</head>
<body>
  <header class="topbar">
    <a href="../../index.html" class="ghost" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-right:8px;font-size:12px;" title="Volver a DanoloTools">← DanoloTools</a>
    <div class="brand"><span class="brand-mark"></span>Cartógrafo</div>
    <nav class="steps" id="steps">
      <button data-step="1"><span>1</span>Terreno</button>
      <button data-step="2"><span>2</span>Generación</button>
      <button data-step="3"><span>3</span>Edición</button>
    </nav>
    <div class="spacer"></div>
    <div class="actions">
      <button id="undo" class="icon" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3.5 9H12a5 5 0 010 10h-2" /></svg></button>
      <button id="redo" class="icon" title="Rehacer (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M16.5 9H8a5 5 0 000 10h2" /></svg></button>
      <span class="sep"></span>
      <div class="theme-wrap"><button id="themeBtn" class="ghost">Tema</button><div id="themePanel" class="theme-panel" hidden></div></div>
      <button id="random" class="ghost">Aleatorizar</button>
      <div class="theme-wrap"><button id="fileBtn" class="ghost">Archivo</button><div id="fileMenu" class="menu-panel" hidden></div></div>
      <div class="theme-wrap"><button id="exportBtn" class="primary">Exportar</button><div id="exportMenu" class="menu-panel" hidden></div></div>
    </div>
  </header>
  <div class="layout">
    <aside class="panel" id="panel"></aside>
    <main class="stage" id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <g id="view">
          <g id="map"></g>
          <image id="densImg" x="0" y="0" preserveAspectRatio="none" opacity="1"></image>
          <image id="distImg" x="0" y="0" preserveAspectRatio="none"></image>
          <g id="overlay"></g>
        </g>
      </svg>
      <div class="hint" id="hint"></div>
      <div class="busy" id="busy">Generando…</div>
      <div class="zoom">
        <button id="zoomIn" title="Acercar">+</button>
        <button id="zoomOut" title="Alejar">−</button>
        <button id="zoomFit" title="Encajar">⤢</button>
      </div>
      <div class="stats" id="stats"></div>
    </main>
  </div>

      if (A < p.lotSize * 0.7) continue;
      const c = centroid(pg.outer);
      blocks.push({ rings: [pg.outer, ...pg.holes], d: up.d, area: A, c, district: districtAtGrid(c[0] / S, c[1] / S) });
    }
  }
  urbanArea = unionAll(urbanArea.map(s => offset(s, 0.3)));

  // caminos a los puertos: del muelle al camino o calle más cercanos
  const portRoads = [];
  if (p.lanes !== false) {
    const targets = [...roads, ...urbanArea];
    for (const pt0 of state.layers.ports || []) {
      const d = [Math.cos(pt0.ang), Math.sin(pt0.ang)];
      const start = [pt0.x * S - d[0] * 6, pt0.y * S - d[1] * 6];
      if (urbanArea.length && pointInShape(start, urbanArea)) continue;
      const tg = snapToShore(start, targets, 900);
      if (!tg || Math.hypot(tg.x - start[0], tg.y - start[1]) < 4) continue;
      const end = [tg.x, tg.y];
      // pequeño quiebro para que no parezca una regla
      const mid = [(start[0] + end[0]) / 2 + (rng() - 0.5) * 12, (start[1] + end[1]) / 2 + (rng() - 0.5) * 12];
      portRoads.push(chaikinOpen([[pt0.x * S, pt0.y * S], start, mid, end]));
    }
  }
  let portRoadPoly = [];
  for (const r of portRoads) portRoadPoly = union(portRoadPoly, bufferLine(r, 2.4));
  if (portRoadPoly.length) {
    const cutter = offset(portRoadPoly, 1.5);
    const cb = bbox(cutter);
    for (let i = blocks.length - 1; i >= 0; i--) {
      const b = blocks[i];
      if (!bboxOverlap(bbox(b.rings), cb)) continue;
      const rest = polygons(difference(b.rings, cutter));
      blocks.splice(i, 1);
      for (const pg of rest) {
        const A = Math.abs(ringArea(pg.outer));
        if (A >= p.lotSize * 0.7) blocks.push({ ...b, rings: [pg.outer, ...pg.holes], area: A, c: centroid(pg.outer) });
      }
    }
  }

  // plazas: manzanas cercanas al centro con algo de azar
  let cx = 0, cy = 0, tw = 0;
  for (const b of blocks) { cx += b.c[0] * b.area; cy += b.c[1] * b.area; tw += b.area; }
  cx /= tw || 1; cy /= tw || 1;
  const plazas = [];
  if (p.plazas > 0 && blocks.length > 6) {
    const cand = blocks
      .map((b, i) => ({ i, s: Math.hypot(b.c[0] - cx, b.c[1] - cy) * (0.6 + rng() * 0.9) }))
      .sort((a, b) => a.s - b.s);
    const chosen = [];
    for (const c of cand) {
      if (chosen.length >= p.plazas) break;
      const b = blocks[c.i];
      if (b.area > p.blockSize * p.blockSize * 2.2) continue;
      if (chosen.some(j => dist(blocks[j].c, b.c) < p.blockSize * 2.5)) continue;
      chosen.push(c.i);
    }
    for (const j of chosen) {
      blocks[j].plaza = true;
      plazas.push({ rings: offset(blocks[j].rings, streetHalf + 0.3), c: centroid(blocks[j].rings[0]), feature: rng() < 0.5 ? 'well' : 'market' });
    }
  }

  const lots = [];
  const trees = [];
  let nextId = 1;
  const courtyards = [];
  for (const b of blocks) {
    if (b.plaza) continue;
    const DX = DISTRICT_FX[b.district] || DISTRICT_FX[0];
    const { lots: lr, yards } = lotsForBlock(b.rings, b.d, { ...p, lotSize: p.lotSize * DX.lot }, rng);
    const core = yards;
    courtyards.push(core);
    // fusiones aleatorias (edificios mayores, formas en L)
    const used = new Set();
    const final = [];
    for (let i = 0; i < lr.length; i++) {
      if (used.has(i)) continue;
      let r = lr[i];
      if (rng() < DX.merge) {
        for (let j = i + 1; j < lr.length; j++) {
          if (used.has(j)) continue;
          if (ringsTouch(lr[i], lr[j])) { r = mergeRings([r, lr[j]]); used.add(j); break; }
        }
      }
      final.push(r);
    }
    for (const r of final) {
      const A = Math.abs(ringArea(r));
      // densidad baja → huecos (jardines) y casas exentas
      if (rng() < (1 - b.d) * (b.d > 0.6 ? 0.3 : 0.55) * DX.drop + DX.garden) {
        if (rng() < p.trees * DX.trees) { const cc = centroid(r); trees.push([cc[0], cc[1], 2.2 + rng() * 1.6]); }
        continue;
      }
      let ring = r;
      if (b.d < 0.55) {
        const sh = offset([r], -(0.8 + (0.55 - b.d) * 4));
        const o = outerRings(sh)[0];
        if (!o || Math.abs(ringArea(o)) < 18) continue;
        ring = o;
      }
      lots.push({ id: nextId++, ring, kind: 'house', d: b.d, district: b.district, block: b, area: Math.abs(ringArea(ring)) || A });
    }
    // árboles en patios
    for (const pg of core.map(r => ({ outer: r, holes: [] }))) {
      const A = Math.abs(ringArea(pg.outer));
      if (A < 30) continue;
      const bb = bbox([pg.outer]);
      const n = Math.round((A / 90) * p.trees * DX.trees);
      for (let k = 0; k < n * 3 && n > 0; k++) {
        const x = bb.x0 + rng() * (bb.x1 - bb.x0), y = bb.y0 + rng() * (bb.y1 - bb.y0);
        if (!pointInRing([x, y], pg.outer) || pg.holes.some(h => pointInRing([x, y], h))) continue;
        const r = 2 + rng() * 1.8;
        if (distPointPolyline([x, y], pg.outer, true) < r * 0.8) continue;
        if (trees.some(t => Math.hypot(t[0] - x, t[1] - y) < (t[2] + r) * 0.8)) continue;
        trees.push([x, y, r]);
        if (trees.length > 6000) break;
      }
    }
  }

  // ciudadelas: torre del homenaje
  for (const cp of citadelPaths()) {
    if (cp.open) continue;
    const ringM = scRings([cp.pts], S)[0];
    if (!ringM || ringM.length < 3) continue;
    const [kx, ky] = centroid(ringM);
    const kr = Math.sqrt(Math.abs(ringArea(ringM)) / Math.PI);
    if (kr < 8) continue;
    const ang = Math.atan2(cy - ky, cx - kx);
    const keepRect = orientedRect(kx, ky, Math.min(kr * 0.75, 42), Math.min(kr * 0.55, 30), ang);
    const inner4 = offset([ringM], -4);
    const keepRing = outerRings(inner4.length ? intersection([keepRect], inner4) : [keepRect])[0] || keepRect;
    lots.push({ id: nextId++, ring: keepRing, kind: 'keep', d: 1, area: Math.abs(ringArea(keepRing)) });
    // pequeñas dependencias interiores
    const inner = offset([ringM], -6);
    const ir = outerRings(inner)[0];
    if (ir && rng() < 0.9) {
      const a2 = ang + Math.PI * (0.7 + rng() * 0.6);
      const px = kx + Math.cos(a2) * kr * 0.62, py = ky + Math.sin(a2) * kr * 0.62;
      const rr = orientedRect(px, py, Math.min(kr * 0.45, 24), 7, a2 + Math.PI / 2);
      const keepZone = offset([keepRing], 3);
      const clip = outerRings(difference(intersection([rr], [ir]), keepZone)).sort((x, y) => Math.abs(ringArea(y)) - Math.abs(ringArea(x)))[0];
      if (clip && Math.abs(ringArea(clip)) > 20) lots.push({ id: nextId++, ring: clip, kind: 'house', d: 1, area: Math.abs(ringArea(clip)) });
    }
  }

  // ---- edificios singulares ----
  const ctr = { next: nextId };
  const mills = placeSpecials({ p, rng, blocks, lots, plazas, cx, cy, S, water, walls, citadels, Z, ctr });
  nextId = ctr.next;

  // ---- granjas ----
  const farms = [];
  const laneSrc = [];
  const millZone = mills.length ? offset(mills, 4) : [];
  const cutF = (shape) => {
    let r = cut(shape, obsF);
    if (portRoadPoly.length) r = difference(r, offset(portRoadPoly, 2));
    if (millZone.length) r = difference(r, millZone);
    return r;
  };
  for (const fp of farmPieces) {
    const sh = cutF(fp.shape);
    if (p.lanes !== false) for (const r of outerRings(sh)) if (Math.abs(ringArea(r)) > 700) laneSrc.push(r);
    for (const pg of polygons(offset(sh, -3.2))) {
      const fence = pg.outer;
      const A = Math.abs(ringArea(fence));
      if (A < 700) continue;
      const fc = centroid(fence);
      const farm = { fence, fields: [], huertas: [] };
      // ¿granja habitada? (más probable cerca del pueblo)
      const near = Math.max(0, 1 - Z.distUrban(fc[0], fc[1]) / (p.farmRing + 60));
      const inhabited = A > 1500 && rng() < 0.45 + near * 0.4;
      let reserved = [];
      if (inhabited) {
        // arista más cercana al centro urbano
        let best = null, bd = Infinity;
        const s = Math.sign(ringArea(fence));
        for (let i = 0; i < fence.length; i++) {
          const a = fence[i], b = fence[(i + 1) % fence.length];
          const L = dist(a, b);
          if (L < 22) continue;
          const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          const dd = Math.hypot(m[0] - cx, m[1] - cy);
          if (dd < bd) { bd = dd; best = { a, b, L, m }; }
        }
        if (best) {
          const dir = [(best.b[0] - best.a[0]) / best.L, (best.b[1] - best.a[1]) / best.L];
          const nin = s > 0 ? [-dir[1], dir[0]] : [dir[1], -dir[0]];
          const ang = Math.atan2(dir[1], dir[0]);
          const w = 10 + rng() * 5, h = 6.5 + rng() * 2;
          const off = (rng() - 0.5) * Math.max(0, best.L - w - 20) * 0.6;
          const hx = best.m[0] + dir[0] * off + nin[0] * (h / 2 + 2.5), hy = best.m[1] + dir[1] * off + nin[1] * (h / 2 + 2.5);
          const house = orientedRect(hx, hy, w, h, ang);
          const parts = [house];
          if (rng() < 0.6) {
            const bw = 7 + rng() * 5, bh = 6 + rng() * 3;
            const sgn = rng() < 0.5 ? -1 : 1;
            const bx = hx + dir[0] * sgn * (w / 2 + bw / 2 + 3) + nin[0] * (bh - h) / 2, by = hy + dir[1] * sgn * (w / 2 + bw / 2 + 3) + nin[1] * (bh - h) / 2;
            parts.push(orientedRect(bx, by, bw, bh, ang));
          }
          for (const r of parts) {
            const clip = outerRings(intersection([r], [fence]))[0];
            if (clip && Math.abs(ringArea(clip)) > 25) lots.push({ id: nextId++, ring: clip, kind: 'farm', d: 0.2, area: Math.abs(ringArea(clip)) });
          }
          // huerta detrás de la casa
          const hw = 14 + rng() * 8, hh = 10 + rng() * 6;
          const gx = hx + nin[0] * (h / 2 + hh / 2 + 3), gy = hy + nin[1] * (h / 2 + hh / 2 + 3);
          const hu = outerRings(intersection([orientedRect(gx, gy, hw, hh, ang)], [fence]))[0];
          if (hu) { farm.huertas.push({ ring: hu, angle: ang }); parts.push(hu); }
          reserved = parts;
          if (rng() < p.trees) trees.push([hx - dir[0] * (w / 2 + 5), hy - dir[1] * (w / 2 + 5), 3 + rng() * 1.5]);
        }
      }
      const fieldArea = reserved.length ? difference([fence], offset(union(reserved), 2.5)) : [fence];
      const tgt = 1100 + rng() * 1600;
      for (const fpg of polygons(fieldArea)) {
        for (const r of subdivide(fpg.outer, tgt, rng)) {
          const ax = mainAxis(r);
          let ang = Math.atan2(ax[1], ax[0]);
          if (rng() < 0.5) ang += Math.PI / 2;
          const shr = outerRings(offset([r], -0.6))[0];
          if (shr && Math.abs(ringArea(shr)) > 60) farm.fields.push({ ring: shr, angle: ang, tone: rng() });
        }
      }
      farms.push(farm);
    }
  }

  // molinos de viento en el campo
  if ((p.specials || {}).mills !== false) {
    const big = farms.filter(f => Math.abs(ringArea(f.fence)) > 3500);
    const placed = [];
    for (let tries = 0; tries < 12 && placed.length < 2 && big.length; tries++) {
      const f = big[Math.floor(rng() * big.length)];
      const fc = centroid(f.fence), vtx = f.fence[Math.floor(rng() * f.fence.length)];
      const c = [fc[0] + (vtx[0] - fc[0]) * 0.35, fc[1] + (vtx[1] - fc[1]) * 0.35];
      if (!pointInRing(c, f.fence) || placed.some(q => dist(q, c) < 220)) continue;
      const body = [];
      for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + Math.PI / 8; body.push([c[0] + Math.cos(a) * 3.6, c[1] + Math.sin(a) * 3.6]); }
      const a0 = rng() * Math.PI / 2, blades = [];
      for (let k = 0; k < 4; k++) { const a = a0 + (k * Math.PI) / 2; blades.push([c, [c[0] + Math.cos(a) * 10, c[1] + Math.sin(a) * 10]]); }
      const zone = [regularPoly(c[0], c[1], 7, 10)];
      f.fields = f.fields.flatMap(fl => outerRings(difference([fl.ring], zone)).filter(r => Math.abs(ringArea(r)) > 40).map(r => ({ ...fl, ring: r })));
      lots.push({ id: nextId++, ring: body, kind: 'windmill', d: 0.3, area: 40, detail: { lines: blades } });
      placed.push(c);
    }
  }

  // sendas entre granjas: siguen los lindes de las parcelas agrícolas
  let lanes = [];
  if (laneSrc.length) {
    lanes = union(laneSrc.flatMap(r => bufferLine(r, 1.5, true)));
    lanes = difference(lanes, offset(water, 0.5));
  }
  for (const l of lots) delete l.block;
  return { urbanArea, blocks: blocks.filter(b => !b.plaza).map(b => b.rings), lots, trees, plazas, farms, lanes, portRoadPoly, center: [cx, cy] };
}

function emptyGen() {
  return { urbanArea: [], blocks: [], lots: [], trees: [], plazas: [], farms: [], lanes: [], portRoadPoly: [], center: [BW / 2, BH / 2] };
}

// ----- Aplicación de ediciones del paso 3 -----
function applyEdits(gen, edits) {
  if (!gen) return [];
  const S2 = (gen.scale || 1) ** 2; // unidades de dibujo² → m²
  const byId = new Map(gen.lots.map(l => [l.id, l]));
  // union-find de fusiones
  const parent = new Map();
  const find = (x) => { while (parent.has(x) && parent.get(x) !== x) x = parent.get(x); return x; };
  for (const [a, b] of edits.merges) {
    if (!byId.has(a) || !byId.has(b)) continue;
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(rb, ra);
  }
  const groups = new Map();
  for (const l of gen.lots) {
    const r = find(l.id);
    (groups.get(r) || groups.set(r, []).get(r)).push(l);
  }
  const deleted = new Set(edits.deleted);
  let out = [];
  for (const [root, members] of groups) {
    if (members.some(m => deleted.has(m.id))) continue;
    if (members.length === 1) out.push({ ...members[0], ids: [members[0].id] });
    else {
      const ring = mergeRings(members.map(m => m.ring));
      const kind = members.some(m => m.kind === 'keep') ? 'keep' : members[0].kind;
      out.push({ id: root, ids: members.map(m => m.id), ring, kind, d: members[0].d, area: Math.abs(ringArea(ring)) * S2 });
    }
  }
  // caminos dibujados por el usuario recortan edificios
  if (edits.roads.length) {
    let rs = [];
    for (const r of edits.roads) rs = union(rs, bufferLine(r.pts, r.width / 2 + 0.6));
    const rb = bbox(rs);
    const res = [];
    for (const b of out) {
      const bb = bbox([b.ring]);
      if (!bboxOverlap(bb, rb)) { res.push(b); continue; }
      const pieces = outerRings(difference([b.ring], rs)).filter(r => Math.abs(ringArea(r)) * S2 > 10);
      pieces.forEach((r, k) => res.push({ ...b, ring: r, area: Math.abs(ringArea(r)) * S2, sub: k }));
    }
    out = res;
  }
  return out;
}

function chaikinOpen(pts) {
  let p = pts;
  for (let k = 0; k < 2; k++) {
    const out = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    out.push(p[p.length - 1]);
    p = out;
  }
  return p;
}

// Efecto de cada tipo de barrio sobre las parcelas
//  lot: multiplica la superficie de parcela · merge: prob. de fusionar parcelas
//  drop/garden: huecos y jardines · trees: árboles
const DISTRICT_FX = {
  0: { lot: 1, merge: 0.12, drop: 1, garden: 0, trees: 1 },
  1: { lot: 1.9, merge: 0.3, drop: 0.6, garden: 0.12, trees: 2.2 },   // rico
  2: { lot: 0.6, merge: 0.03, drop: 0.35, garden: 0, trees: 0.2 },    // pobre
  3: { lot: 1.45, merge: 0.28, drop: 0.3, garden: 0, trees: 0.5 },    // mercantil
  4: { lot: 1.3, merge: 0.15, drop: 1, garden: 0.06, trees: 1.6 },    // religioso
};

// ----------------- Edificios singulares -----------------
function blockAxes(ring) {
  const dir = mainAxis(ring);
  const e = extents(ring, dir);
  const la = e.a1 - e.a0, lb = e.b1 - e.b0;
  return la >= lb ? { u: dir, v: e.n, long: la, short: lb } : { u: e.n, v: dir, long: lb, short: la };
}
const P = (c, u, v, a, b) => [c[0] + u[0] * a + v[0] * b, c[1] + u[1] * a + v[1] * b];
const rectUV = (c, u, v, L, W) => [P(c, u, v, -L / 2, -W / 2), P(c, u, v, L / 2, -W / 2), P(c, u, v, L / 2, W / 2), P(c, u, v, -L / 2, W / 2)];

// Coloca `shape` en la manzana: quita las parcelas que choquen. Devuelve el anillo ajustado o null.
function claim(lots, shapeRings, inside, clearance) {
  const fit = outerRings(intersection(shapeRings, inside)).sort((a, b) => Math.abs(ringArea(b)) - Math.abs(ringArea(a)))[0];
  if (!fit) return null;
  const want = shapeArea(shapeRings);
  if (Math.abs(ringArea(fit)) < want * 0.75) return null;
  const zone = offset([fit], clearance);
  const zb = bbox(zone);
  for (let i = lots.length - 1; i >= 0; i--) {
    const l = lots[i];
    if (l.kind !== 'house') continue;
    if (!bboxOverlap(bbox([l.ring]), zb)) continue;
    if (intersection([l.ring], zone).length) lots.splice(i, 1);
  }
  return fit;
}

function placeSpecials({ p, rng, blocks, lots, plazas, cx, cy, S, water, walls, citadels, Z, ctr }) {
  const sp = p.specials || {};
  const free = blocks.filter(b => !b.plaza);
  const take = (b) => { b.used = true; };
  const mills = [];

  // --- templo / catedral: planta de cruz con ábside ---
  if (sp.temple !== false && free.length > 3) {
    const cand = free.filter(b => b.area > 700)
      .map(b => ({ b, s: Math.hypot(b.c[0] - cx, b.c[1] - cy) * (b.district === 4 ? 0.25 : 1) * (0.7 + rng() * 0.6) }))
      .sort((a, b) => a.s - b.s);
    for (const { b } of cand.slice(0, 6)) {
      const ring = b.rings[0];
      const { u, v, long, short } = blockAxes(ring);
      const inside = offset(b.rings, -1.5);
      let done = false;
      for (const k of [1, 0.85, 0.7]) {
        const L = Math.min(long * 0.78, 72) * k, W = Math.max(6, Math.min(short * 0.3, 17) * k);
        if (L < 18) break;
        const c = b.c;
        const nave = rectUV(c, u, v, L, W);
        const tc = P(c, u, v, L * 0.16, 0);
        const transept = rectUV(tc, u, v, W * 0.95, Math.min(short * 0.72, W * 2.7));
        const ac = P(c, u, v, L / 2, 0), apse = [];
        for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * Math.PI; apse.push(P(ac, u, v, Math.cos(a) * W * 0.5, Math.sin(a) * W * 0.5)); }
        const cross = union([nave, transept, apse]);
        const fit = claim(lots, cross, inside, 3);
        if (!fit) continue;
        const front = P(c, u, v, -L / 2 + W * 0.45, 0);
        lots.push({
          id: ctr.next++, ring: fit, kind: 'temple', d: 1, area: Math.abs(ringArea(fit)),
          detail: { lines: [[P(c, u, v, -L / 2, 0), P(c, u, v, L / 2, 0)], [P(tc, u, v, 0, -Math.min(short * 0.72, W * 2.7) / 2), P(tc, u, v, 0, Math.min(short * 0.72, W * 2.7) / 2)]], polys: [rectUV(front, u, v, W * 0.8, W * 0.8)] },
        });
        take(b); done = true; break;
      }
      if (done) break;
    }
  }

  // --- ayuntamiento: junto a la plaza principal ---
  if (sp.hall !== false) {
    const ref = plazas[0] ? plazas[0].c : [cx, cy];
    const cand = free.filter(b => !b.used && b.area > 500).sort((a, b) => dist(a.c, ref) - dist(b.c, ref));
    for (const b of cand.slice(0, 5)) {
      const { u, v, long, short } = blockAxes(b.rings[0]);
      const L = Math.min(long * 0.62, 36), W = Math.min(short * 0.55, 18);
      if (L < 14 || W < 8) continue;
      const fit = claim(lots, [rectUV(b.c, u, v, L, W)], offset(b.rings, -1.5), 2.5);
      if (!fit) continue;
      const tw = P(b.c, u, v, -L / 2 + W * 0.3, 0);
      lots.push({ id: ctr.next++, ring: fit, kind: 'hall', d: 1, area: Math.abs(ringArea(fit)),
        detail: { lines: [[P(b.c, u, v, -L / 2, 0), P(b.c, u, v, L / 2, 0)]], polys: [rectUV(tw, u, v, W * 0.42, W * 0.42)] } });
      take(b); break;
    }
  }

  // --- mercado cubierto: en una plaza ---
  if (sp.market !== false && plazas.length) {
    const pl = plazas.find(x => x.feature === 'market') || plazas[plazas.length - 1];
    const ring = outerRings(pl.rings)[0];
    if (ring) {
      const { u, v, long, short } = blockAxes(ring);

function toolButtons(list) {
  return `<div class="tools">${list.map(([id, label]) =>
    `<button class="tool ${state.tool === id ? 'active' : ''}" data-tool="${id}"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${label}</button>`).join('')}</div>`;
}
function elemButtons() {
  return `<div class="elem-grid">${ELEMENTS.map(([id, label]) =>
    `<button class="tool ${state.opts.element === id ? 'active' : ''}" data-elem="${id}"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${label}</button>`).join('')}</div>`;
}
const slider = (key, label, min, max, step, unit = '', obj = 'opts') => {
  const v = state[obj][key];
  return `<label class="slider"><div class="top"><span>${label}</span><span id="o-${key}">${fmtVal(v, unit)}</span></div>
  <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-key="${key}" data-obj="${obj}" data-unit="${unit}"></label>`;
};
// Las medidas de dibujo ('dm') se muestran en metros reales según la escala del mapa
const fmtVal = (v, u) => {
  const S = state.params.mapScale || 1;
  if (u === '%') return Math.round(v * 100) + ' %';
  if (u === 'scale') return `${Math.round(WORLD.w * v).toLocaleString('es-ES')} × ${Math.round(WORLD.h * v).toLocaleString('es-ES')} m`;
  if (u === 'dm') { const m = v * S; return (m < 10 ? m.toFixed(1).replace('.', ',') : Math.round(m).toLocaleString('es-ES')) + ' m'; }
  return (Math.round(v * 100) / 100).toLocaleString('es-ES') + (u ? ' ' + u : '');
};
const scaleSection = () => `<section><h2>Escala del mapa</h2>

const pcheck = (key, label, on) => `<label class="check"><input type="checkbox" data-pcheck="${key}" ${on ? 'checked' : ''}> ${label}</label>`;

      <section><h2>Edificios singulares</h2>
      ${[['temple', 'Templo o catedral'], ['hall', 'Ayuntamiento'], ['market', 'Mercado cubierto'], ['barracks', 'Cuarteles'], ['mills', 'Molinos de agua y viento']].map(([k, l]) => pcheck('sp.' + k, l, (state.params.specials || {})[k] !== false)).join('')}</section>
      <section class="grow"><p>Celdas más pequeñas → asentamiento más denso. La densidad pintada con el aerógrafo modula el tamaño de manzana, la profundidad de las parcelas y los huecos entre casas.</p></section>

function bindPanel() {
  document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  document.querySelectorAll('[data-elem]').forEach(b => b.onclick = () => { state.opts.element = b.dataset.elem; cancelTool(); renderPanel(); refresh(); });
  document.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { state.opts.polyMode = b.dataset.pm; cancelTool(); renderPanel(); drawOverlay(); });
  document.querySelectorAll('[data-soil]').forEach(b => b.onclick = () => { state.opts.soilMode = b.dataset.soil; renderPanel(); });
  document.querySelectorAll('[data-dist]').forEach(b => b.onclick = () => { state.opts.districtType = +b.dataset.dist; state.opts.drawErase = false; renderPanel(); refresh(); });
  const asp = $('#aspectSel');
  if (asp) asp.onchange = () => setAspect(asp.value);
  document.querySelectorAll('[data-pcheck]').forEach(c => c.onchange = () => {
    pushHistory();
    const k = c.dataset.pcheck;
    if (k.startsWith('sp.')) state.params.specials = { ...(state.params.specials || {}), [k.slice(3)]: c.checked };
    else state.params[k] = c.checked;
    if (k !== 'scaleBar') state.edits = { merges: [], deleted: [], roads: [] };
    refresh();
  });
  document.querySelectorAll('[data-check]').forEach(c => c.onchange = () => { state.opts[c.dataset.check] = c.checked; renderPanel(); refresh(); });
  let optEditing = false;
  document.querySelectorAll('input[type=range][data-key]').forEach(inp => {
    const key = inp.dataset.key, obj = inp.dataset.obj, unit = inp.dataset.unit;
    inp.oninput = () => {
      $('#o-' + key).textContent = fmtVal(+inp.value, unit);
      if (obj === 'opts') {
        state.opts[key] = +inp.value;
        if (key === 'wallWidth' || key === 'towerR') {
          const target = state.opts.element === 'citadel' ? state.layers.citadels : state.layers.walls;
          if (target && target.length) {
            if (!optEditing) { pushHistory(); optEditing = true; }
            const prop = key === 'wallWidth' ? 'width' : 'towerR';
            for (const w of target) w[prop] = +inp.value;
            cancelAnimationFrame(gapRaf); gapRaf = requestAnimationFrame(refresh);
            return;
          }
        }
        drawOverlay();
      }
      if (key === 'buildingGap' || key === 'roofVar') { state.params[key] = +inp.value; cancelAnimationFrame(gapRaf); gapRaf = requestAnimationFrame(refresh); }
    };
    inp.onchange = () => {
      if (optEditing) { optEditing = false; refresh(); return; }
      if (obj === 'params' && (key === 'buildingGap' || key === 'roofVar')) {
        pushHistory(); state.params[key] = +inp.value; refresh(); return;
      }
      if (obj === 'params') {
        pushHistory();
        state.params[key] = +inp.value;
        state.edits = { merges: [], deleted: [], roads: [] };
        if (key === 'mapScale') renderPanel();
        refresh();
      }
    };
  });
  bindSelection();
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('next', () => goStep(state.step + 1));
  on('prev', () => goStep(state.step - 1));
  on('reseed', () => {
    pushHistory();
    state.params.seed = (Math.random() * 1e9) | 0;
    state.edits = { merges: [], deleted: [], roads: [] };
    renderPanel(); ensureGen();
  });
  on('clearAll', () => {
    pushHistory();
    state.layers = emptyLayers(); state.density.fill(0); state.districts.fill(0);
    state.edits = { merges: [], deleted: [], roads: [] };
    renderPanel(); refresh();
  });
  on('resetEdits', () => { pushHistory(); state.edits = { merges: [], deleted: [], roads: [] }; refresh(); });
}

function setAspect(id) {
  const a = ASPECTS.find(x => x.id === id);
  if (!a || id === state.params.aspect) return;
  pushHistory();
  const oldW = WORLD.w, oldH = WORLD.h;
  state.params.aspect = id;
  syncAspect();
  shiftWorld((WORLD.w - oldW) / 2, (WORLD.h - oldH) / 2);
  state.edits = { merges: [], deleted: [], roads: [] };
  fit();
  renderPanel();
  refresh();
}

function goStep(n) {
  if (n >= 2 && !settlementDefined()) { n = 1; }
  cancelTool();
  state.step = n;
  if (n === 1 && !TOOLS1.some(t => t[0] === state.tool)) state.tool = 'poly';
  if (n === 3 && (state.tool === 'hand' || !TOOLS3.some(t => t[0] === state.tool))) state.tool = 'merge';
  if (n === 2) state.tool = 'hand';
  renderPanel();
  refresh();
}
document.querySelectorAll('#steps button').forEach(b => b.onclick = () => goStep(+b.dataset.step));

function setTool(t) { cancelTool(); state.tool = t; renderPanel(); drawOverlay(); }

// ================= Interacción con el puntero =================
let poly = null;       // dibujo de polilínea/polígono libre en curso {pts, raw, down, dragging}
let shapeDrag = null;  // dibujo de rectángulo o círculo {mode, start, cur, shift, alt}
let brush = null;      // trazo de pincel en curso
let spray = null;      // aerógrafo
let pan = null;
let spaceDown = false;
let cursor = null;
let selected = null;   // edificio seleccionado para unir
let hover = null;
let lastDown = null;
let selList = [];      // lista de elementos seleccionados [{layer, i}, ...]
let sel = null;        // primer elemento seleccionado {layer, i} o null
let drag = null;       // arrastre de vértice, cuerpo, transformación o recuadro

const isPolyVertexTool = () => (state.tool === 'poly' && state.opts.polyMode === 'free') || state.tool === 'stroke' || state.tool === 'path';
const isShapeDragTool = () => state.tool === 'poly' && (state.opts.polyMode === 'rect' || state.opts.polyMode === 'circle');
const isBrushTool = () => state.tool === 'paint';
const closedTool = () => state.tool === 'poly';

function syncSel() {
  selList = selList.filter(r => !!getItem(r));
  sel = selList[0] || null;
}
function isSelected(ref) {
  return !!ref && selList.some(s => s.layer === ref.layer && s.i === ref.i);
}
function setSelList(list) {
  const seen = new Set();
  selList = [];
  for (const r of list) {
    if (!r || !getItem(r)) continue;
    const k = r.layer + ':' + r.i;
    if (seen.has(k)) continue;
    seen.add(k);
    selList.push({ layer: r.layer, i: r.i });
  }
  syncSel();
}
function toggleSel(ref) {
  if (!ref) return;
  if (isSelected(ref)) selList = selList.filter(s => !(s.layer === ref.layer && s.i === ref.i));
  else selList.push({ layer: ref.layer, i: ref.i });
  syncSel();
}

function cancelTool() {
  poly = null; shapeDrag = null; brush = null; spray = null;
  selected = null; selList = []; sel = null; drag = null;
  drawOverlay();
}

function shapeDragRing(sd) {
  if (!sd) return [];
  const [x0, y0] = sd.start, [x1, y1] = sd.cur;
  if (sd.mode === 'rect') {
    let dx = x1 - x0, dy = y1 - y0;
    if (sd.shift) {
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      dx = Math.sign(dx || 1) * m; dy = Math.sign(dy || 1) * m;
    }
    const ax0 = sd.alt ? x0 - dx : x0, ay0 = sd.alt ? y0 - dy : y0;
    const ax1 = x0 + dx, ay1 = y0 + dy;
    const minX = Math.min(ax0, ax1), maxX = Math.max(ax0, ax1);
    const minY = Math.min(ay0, ay1), maxY = Math.max(ay0, ay1);
    if (maxX - minX < 2 || maxY - minY < 2) return [];
    return [[minX, minY], [maxX, minY], [maxX, maxY], [minX, maxY]];
  }
  if (sd.mode === 'circle') {
    const r = dist([x0, y0], [x1, y1]);
    if (r < 2) return [];
    const n = 32, ring = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      ring.push([x0 + Math.cos(a) * r, y0 + Math.sin(a) * r]);
    }
    return ring;
  }
  return [];
}

// Ajusta el punto b a múltiplos de 45° respecto a a (con Mayús pulsado)
function snap45(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], r = Math.hypot(dx, dy);
  if (r < 1e-6) return b;
  const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
  return [a[0] + Math.cos(ang) * r, a[1] + Math.sin(ang) * r];
}

svg.addEventListener('pointerdown', (e) => {
  svg.setPointerCapture(e.pointerId);
  const w = toWorld(e);
  if (e.button === 1 || e.button === 2 || spaceDown || state.tool === 'hand' || state.step === 2) {
    pan = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    svg.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0) return;
  if (isShapeDragTool()) {
    shapeDrag = { mode: state.opts.polyMode, start: w, cur: w, shift: e.shiftKey, alt: e.altKey };
  } else if (isPolyVertexTool()) {
    const now = performance.now();
    if (poly && lastDown && now - lastDown.t < 380 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 7) {
      lastDown = null; finishPoly(); return;
    }
    lastDown = { t: now, x: e.clientX, y: e.clientY };
    if (!poly) poly = { pts: [], raw: null, down: null, dragging: false };
    const wp = (e.shiftKey && poly.pts.length) ? snap45(poly.pts[poly.pts.length - 1], w) : w;
    poly.down = { w: wp, sx: e.clientX, sy: e.clientY };
    poly.raw = [wp];
  } else if (isBrushTool()) {
    brush = { pts: [w] };
  } else if (state.tool === 'select') {
    selectDown(w, e);
  } else if (state.tool === 'settle') {
    pushHistory();
    spray = { w, last: performance.now() };
    sprayTick();
  } else clickTool(w);
  drawOverlay();
});
svg.addEventListener('pointermove', (e) => {
  const w = toWorld(e);
  cursor = (e.shiftKey && poly && poly.pts.length && !poly.dragging) ? snap45(poly.pts[poly.pts.length - 1], w) : w;
  if (pan) {
    view.x = pan.vx + e.clientX - pan.sx; view.y = pan.vy + e.clientY - pan.sy;
    applyView();
    return;
  }
  if (shapeDrag) {
    shapeDrag.cur = w; shapeDrag.shift = e.shiftKey; shapeDrag.alt = e.altKey;
    drawOverlay();
    return;
  }
  if (poly && poly.down) {
    if (!poly.dragging && Math.hypot(e.clientX - poly.down.sx, e.clientY - poly.down.sy) > 5) poly.dragging = true;
    if (poly.dragging) poly.raw.push(w);
  }
  if (brush) brush.pts.push(w);
  if (spray) spray.w = w;
  if (drag) { selectMove(w, e); return; }
  if (state.tool === 'select') hover = hitTest(w);
  if (['erase', 'merge', 'delb', 'pathx'].includes(state.tool)) hover = hitTest(w);
  drawOverlay();
});
svg.addEventListener('pointerup', () => {
  if (pan) { pan = null; svg.style.cursor = ''; return; }
  if (shapeDrag) {
    const pts = shapeDragRing(shapeDrag);
    shapeDrag = null;
    if (pts.length >= 3) {
      pushHistory();
      commitDrawnElement('poly', pts);
      renderPanel(); refresh();
    } else drawOverlay();
    return;
  }
  if (drag) {
    const moved = drag.moved, isMarquee = drag.type === 'marquee';
    drag = null;
    if (moved || isMarquee) { renderPanel(); refresh(); }
    else drawOverlay();
    return;
  }
  if (poly && poly.down) {
    if (poly.dragging) {
      const eps = 2.2 / view.k;
      let fr = chaikin(simplify(poly.raw, eps), 2);
      poly.pts.push(...(poly.pts.length ? fr.slice(1) : fr));
    } else {
      poly.pts.push(poly.down.w);
    }
    poly.down = null; poly.dragging = false; poly.raw = null;
  }
  if (brush) {
    const pts = simplify(brush.pts, 1.5 / view.k);
    commitBrush(pts.length ? pts : [brush.pts[0]]);
    brush = null;
  }
  if (spray) { spray = null; renderPanel(); refresh(); }
  drawOverlay();
});
svg.addEventListener('dblclick', (e) => { e.preventDefault(); if (state.tool === 'select') insertVertex(toWorld(e)); else finishPoly(); });
svg.addEventListener('contextmenu', (e) => e.preventDefault());
svg.addEventListener('pointerleave', () => { cursor = null; hover = null; drawOverlay(); });

function sprayTick() {
  if (!spray) return;
  const now = performance.now();
  const dt = Math.min(60, now - spray.last); spray.last = now;
  sprayDensity(spray.w[0], spray.w[1], state.opts.brushR, state.opts.densStrength * dt * 0.004, state.opts.densErase);
  updateDensityImage();
  requestAnimationFrame(sprayTick);
}

function commitDrawnElement(toolKind, pts) {
  const L = state.layers, o = state.opts, el = o.element;
  const mode = o.drawErase ? 'sub' : 'add';
  const r = o.brushR;
  if (toolKind === 'poly') {
    if (el === 'water') L.lakes.push({ pts, kind: 'poly', mode });
    else if (el === 'road') L.roads.push({ pts, kind: 'poly', mode });
    else if (el === 'cliff') L.cliffs.push({ pts, kind: 'poly', mode });
    else if (el === 'wall') L.walls.push({ pts, kind: 'poly', open: false, width: o.wallWidth, towerR: o.towerR });
    else if (el === 'forest') L.forest.push({ pts, kind: 'poly', mode });
    else if (el === 'citadel') L.citadels.push({ pts, kind: 'poly', open: false, width: o.wallWidth, towerR: o.towerR });
    else if (el === 'soil') (L[o.soilMode] = L[o.soilMode] || []).push({ pts, kind: 'poly', mode });
    else if (el === 'district') (L.districts = L.districts || []).push({ pts, kind: 'poly', type: o.districtType, mode });
  } else if (toolKind === 'stroke') {
    if (el === 'water') L.rivers.push({ pts, kind: 'stroke', width: o.riverWidth, mode: 'add' });
    else if (el === 'road') L.roads.push({ pts, kind: 'stroke', width: o.roadWidth, mode: 'add' });
    else if (el === 'cliff') L.cliffs.push({ pts, kind: 'stroke', width: o.cliffWidth, mode });
    else if (el === 'wall') L.walls.push({ pts, kind: 'stroke', open: true, width: o.wallWidth, towerR: o.towerR });
    else if (el === 'forest') L.forest.push({ pts, kind: 'stroke', r, mode });
    else if (el === 'citadel') L.citadels.push({ pts, kind: 'stroke', open: true, width: o.wallWidth, towerR: o.towerR });
    else if (el === 'soil') (L[o.soilMode] = L[o.soilMode] || []).push({ pts, kind: 'stroke', r, mode });
    else if (el === 'district') (L.districts = L.districts || []).push({ pts, kind: 'stroke', r, type: o.districtType, mode });
  } else if (toolKind === 'paint') {
    if (el === 'wall' || el === 'citadel') {
      const rings = outerRings(bufferLine(pts, r, false));
      const target = el === 'wall' ? L.walls : L.citadels;
      for (const ring of rings) {
        const simp = simplifyPts(ring, 2, true);
        if (simp.length >= 3) target.push({ pts: simp, kind: 'poly', open: false, width: o.wallWidth, towerR: o.towerR });
      }
    } else if (el === 'water') L.lakes.push({ pts, kind: 'paint', r, mode });
    else if (el === 'road') L.roads.push({ pts, kind: 'paint', r, mode });
    else if (el === 'cliff') L.cliffs.push({ pts, kind: 'paint', r, mode });
    else if (el === 'forest') L.forest.push({ pts, kind: 'paint', r, mode });
    else if (el === 'soil') (L[o.soilMode] = L[o.soilMode] || []).push({ pts, kind: 'paint', r, mode });
    else if (el === 'district') (L.districts = L.districts || []).push({ pts, kind: 'paint', r, type: o.districtType, mode });
  }
}

function finishPoly() {
  if (!poly) return;
  const pts = [];
  for (const p of poly.pts) if (!pts.length || dist(pts[pts.length - 1], p) > 0.8) pts.push(p);
  const closed = closedTool();
  poly = null;
  if (pts.length < (closed ? 3 : 2)) { drawOverlay(); return; }
  pushHistory();
  if (state.tool === 'path') state.edits.roads.push({ pts, width: state.opts.userRoadWidth });
  else commitDrawnElement(state.tool === 'poly' ? 'poly' : 'stroke', pts);
  renderPanel(); refresh();
}
function commitBrush(pts) {
  pushHistory();
  commitDrawnElement('paint', pts);
  renderPanel(); refresh();
}

// ---- pruebas de selección ----
function isClosedItem(layer, it) {
  if (!it) return false;
  if (it.x !== undefined && it.r !== undefined && !it.pts) return true;
  if (it.kind === 'poly') return true;
  if (it.kind === 'stroke' || it.kind === 'paint') return false;
  if (layer === 'walls' || layer === 'citadels') return !it.open;
  if (layer === 'cliffs') return it.width === undefined && it.r === undefined;
  return false;
}

function hitTest(w) {
  const t = state.tool;
  const tol = 6 / view.k + 2;
  if (t === 'select') {
    if (state.step === 3) {
      let best = null, bd = Infinity;
      state.edits.roads.forEach((r, i) => { const d = distPointPolyline(w, r.pts) - r.width / 2; if (d < tol && d < bd) { bd = d; best = { layer: 'eroads', i }; } });
      return best;
    }
    return hitLayers(w, tol, true);
  }
  if (t === 'erase') return hitLayers(w, tol, false);
  if (t === 'merge' || t === 'delb') {
    for (const b of buildings) if (pointInRing(w, b.ring)) return b;
    return null;
  }
  if (t === 'pathx') {
    let best = null, bd = Infinity;
    state.edits.roads.forEach((r, i) => { const d = distPointPolyline(w, r.pts) - r.width / 2; if (d < tol && d < bd) { bd = d; best = i; } });
    return best;
  }
  return null;
}

function hitLayers(w, tol, includeSub) {
  const L = state.layers;
  let best = null, bd = Infinity;
  const consider = (layer, i, d) => { if (d < bd) { bd = d; best = { layer, i }; } };
  const checkItem = (layer, r, i, prio = 0) => {
    if (!r) return;
    if (!includeSub && r.mode === 'sub') return;
    if (layer === 'ports') {
      const dx = w[0] - r.x, dy = w[1] - r.y, c = Math.cos(r.ang), s2 = Math.sin(r.ang);
      const v = dx * c + dy * s2, u = -dx * s2 + dy * c;
      if (Math.abs(u) < r.w / 2 + tol && v > -6 - tol && v < r.len + 10 + tol) consider('ports', i, 0.2);
      return;
    }
    if (r.x !== undefined && r.r !== undefined && !r.pts) {
      const half = Math.max((r.width || 3) / 2, r.towerR ?? 2.6);
      const d = Math.abs(Math.hypot(w[0] - r.x, w[1] - r.y) - r.r) - half;
      if (d < tol) consider(layer, i, d);
      else if (Math.hypot(w[0] - r.x, w[1] - r.y) < r.r) consider(layer, i, tol * 0.75 + prio);
      return;
    }
    if (!r.pts || !r.pts.length) return;
    const closed = isClosedItem(layer, r);
    if (closed) {
      const edgeHalf = (layer === 'walls' || layer === 'citadels') ? Math.max((r.width || 3.6) / 2, r.towerR ?? 2.8) : 0;
      const dEdge = distPointPolyline(w, r.pts, true) - edgeHalf;
      if (dEdge < tol) consider(layer, i, dEdge + prio * 0.2);
      else if (layer !== 'walls' && pointInRing(w, r.pts)) consider(layer, i, tol * 0.8 + prio);
    } else {
      const half = (layer === 'walls' || layer === 'citadels')
        ? Math.max((r.width || 3.6) / 2, r.towerR ?? 2.8)
        : (r.width ? r.width / 2 : (r.r || 2));
      const d = distPointPolyline(w, r.pts, false) - half;
      if (d < tol) consider(layer, i, d + prio * 0.5);
    }
  };
  (L.rivers || []).forEach((r, i) => checkItem('rivers', r, i, 0.2));
  (L.roads || []).forEach((r, i) => checkItem('roads', r, i, 0.1));
  (L.walls || []).forEach((r, i) => checkItem('walls', r, i, 0));
  (L.cliffs || []).forEach((r, i) => checkItem('cliffs', r, i, 0.4));
  (L.lakes || []).forEach((r, i) => checkItem('lakes', r, i, 0.8));
  (L.forest || []).forEach((r, i) => checkItem('forest', r, i, 0.8));
  for (const k of ['sand', 'marsh', 'crops', 'districts']) (L[k] || []).forEach((r, i) => checkItem(k, r, i, 1));
  (L.citadels || []).forEach((c, i) => checkItem('citadels', c, i, 0.1));
  (L.ports || []).forEach((pt, i) => checkItem('ports', pt, i, 0));
  return best;
}

// ================= Selección y edición de elementos =================
const SEL_NAMES = {
  rivers: 'Agua (cauce)', roads: 'Camino', walls: 'Muralla', cliffs: 'Risco',
  lakes: 'Agua', forest: 'Bosque', citadels: 'Ciudadela', ports: 'Puerto',
  eroads: 'Camino', sand: 'Playa', marsh: 'Pantano', crops: 'Cultivos', districts: 'Barrio',
};
function getItem(s0) {
  if (!s0) return null;
  const arr = s0.layer === 'eroads' ? state.edits.roads : state.layers[s0.layer];
  return arr ? arr[s0.i] || null : null;
}
function layerArray(layer) { return layer === 'eroads' ? state.edits.roads : state.layers[layer]; }

const propSlider = (prop, label, min, max, step, v, unit = 'dm') =>
  `<label class="slider"><div class="top"><span>${label}</span><span id="p-${prop}">${fmtVal(v, unit)}</span></div>
  <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-prop="${prop}" data-unit="${unit}"></label>`;

function selectionPanel() {
  syncSel();
  const modeToggle = `<div class="seg"><button data-selmode="pts" class="${!state.opts.selectTransform ? 'active' : ''}">Puntos</button><button data-selmode="xform" class="${state.opts.selectTransform ? 'active' : ''}">Transformar</button></div>`;
  if (!selList.length) {
    return modeToggle + `<p>${state.step === 3 ? 'Haz clic o arrastra sobre caminos dibujados en este paso.' : 'Haz clic sobre un elemento, usa Mayús+clic o arrastra un recuadro para seleccionar varios elementos.'}</p>`;
  }

    if (wallRefs.length) {

      h += propSlider('width', 'Grosor de muralla', 1, 18, 0.2, w0?.width ?? (wallRefs[0].layer === 'citadels' ? 3 : 3.6));

    h += `<p class="small">${state.opts.selectTransform ? 'Usa la caja delimitadora para escalar, rotar o mover todos los elementos seleccionados.' : 'Arrastra cualquiera de ellos para moverlos juntos, o activa Transformar para escalar y rotar.'}</p>`;
    return h;
  }
  const it = getItem(sel);
  let h = modeToggle;
  const dName = sel.layer === 'districts' && DISTRICTS[it.type] ? `Barrio ${DISTRICTS[it.type].name.toLowerCase()}` : SEL_NAMES[sel.layer];
  h += `<div class="selname">${dName}${it.pts ? `<span>${it.pts.length} puntos</span>` : ''}</div>`;
  if (sel.layer === 'walls' || sel.layer === 'citadels') {
    h += propSlider('width', 'Grosor de muralla', 1, 18, 0.2, it.width ?? (sel.layer === 'citadels' ? 3 : 3.6));
    h += propSlider('towerR', 'Tamaño de torreones', 0, 18, 0.2, it.towerR ?? (sel.layer === 'citadels' ? 2.6 : 2.8));
  } else if (it.width !== undefined) {
    const maxW = sel.layer === 'rivers' || sel.layer === 'cliffs' ? 120 : (sel.layer === 'eroads' ? 14 : 36);
    h += propSlider('width', 'Anchura', 1, maxW, 0.5, it.width);
  }
  if (it.r !== undefined && sel.layer !== 'citadels') {
    h += propSlider('r', 'Radio del trazo', 3, 200, 1, it.r);
  }
  if (['lakes', 'forest', 'sand', 'marsh', 'crops', 'districts', 'cliffs', 'roads'].includes(sel.layer) && !['walls', 'citadels'].includes(sel.layer) && it.kind !== 'stroke') {
    h += `<div class="seg"><button data-mode="add" class="${it.mode !== 'sub' ? 'active' : ''}">Añade</button><button data-mode="sub" class="${it.mode === 'sub' ? 'active' : ''}">Borra</button></div>`;
  }
  if (sel.layer === 'citadels' && it.r !== undefined && !it.pts) h += propSlider('r', 'Radio del recinto', 8, 120, 1, it.r);
  if (sel.layer === 'ports') {

    h += propSlider('len', 'Longitud de los embarcaderos', 4, 120, 1, it.len);
    h += propSlider('n', 'Embarcaderos', 0, 12, 1, it.n, '');
  }
  h += '<div class="btn-row">';
  if (it.pts && it.pts.length > 2) h += '<button class="ghost" id="selSmooth">Suavizar</button><button class="ghost" id="selSimplify">Simplificar</button>';
  h += '<button class="ghost" id="selDup">Duplicar</button><button class="ghost danger" id="selDel">Eliminar</button></div>';
  h += `<p class="small">${state.opts.selectTransform ? 'Arrastra las esquinas/lados para escalar, el tirador superior para rotar o el interior para reposicionar.' : 'Arrastra los puntos o la forma. Doble clic en el trazo añade un punto; Alt + clic sobre un punto lo quita.'}</p>`;
