<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabula Ultima · Fichas</title>
  <meta name="description" content="Generador y visor de personajes de Fabula Ultima.">
  <script>
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
    try { var t = localStorage.getItem('fu-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 7v12l-11 7-11-7V10z' fill='%23d4b072'/%3E%3C/svg%3E">
  <style>
    .portada { max-width: 760px; margin: 0 auto; padding: 12vh 20px 40px; }
    .portada h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1; }
    .portada p.lead { color: var(--muted); margin: 10px 0 32px; font-size: 16px; }
    .accesos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .acceso { display: block; padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); }
    .acceso:hover { border-color: var(--accent); text-decoration: none; }
    .acceso h2 { font-size: 18px; margin-bottom: 6px; }
    .acceso p { color: var(--muted); margin: 0; }
    @media (max-width: 560px) { .accesos { grid-template-columns: 1fr; } }
    .tema { position: fixed; top: 14px; right: 14px; }
  </style>
</head>
<body>
  <a href="../../index.html" class="btn fantasma" style="position:fixed;top:14px;left:14px;text-decoration:none;z-index:10;font-size:13px;display:inline-flex;align-items:center;gap:6px;" title="Volver a DanoloTools">← DanoloTools</a>
  <button class="btn icono fantasma tema" data-tema-toggle aria-label="Cambiar tema"></button>
  <main class="portada">
    <h1 class="display">Fabula Ultima</h1>
    <p class="lead">Fichas de personaje para vuestra mesa.</p>
    <div class="accesos">
      <a class="acceso" href="generador/index.html"><h2>Generador</h2><p>Crea personajes, súbelos de nivel y descárgalos en JSON.</p></a>
      <a class="acceso" href="visor/index.html"><h2>Visor</h2><p>Consulta las fichas del grupo y sus relaciones.</p></a>
    </div>
  </main>
  <script type="module">import { initTema } from './assets/js/ui.js'; initTema();</script>
</body>
</html>
