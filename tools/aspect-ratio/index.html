<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspect Ratio — DanoloTools</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrapper">
        <a href="../../index.html" class="brand-logo">
          <div class="brand-icon-box">D</div>
          <span>DANOLO<span style="color: var(--cyan);">//</span>TOOLS</span>
        </a>
      </div>
      <nav class="header-nav">
        <a href="../../index.html" class="nav-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Volver</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="padding-top: 1.5rem;">
    <div style="margin-bottom: 1.5rem;">
      <h1 class="hero-title" style="font-size: 1.75rem; margin-bottom: 0;">
        Calculadora <span class="gradient-text">Aspect Ratio</span>
      </h1>
    </div>

    <div class="calculator-wrapper">
      
      <!-- Controls Panel -->
      <section class="calc-panel">
        <!-- Common Presets Dropdown -->
        <div class="form-group">
          <label for="presetSelect" class="form-label">Common Presets</label>
          <select id="presetSelect" class="form-select">
            <option value="9:16" selected>Vertical Video 9:16</option>
            <option value="16:9">Widescreen 16:9</option>
            <option value="1:1">Square 1:1</option>
            <option value="4:5">Vertical 4:5</option>
            <option value="4:3">Standard 4:3</option>
            <option value="3:4">Portrait 3:4</option>
            <option value="21:9">Ultrawide 21:9</option>
            <option value="9:21">Ultrawide 9:21</option>
            <option value="3:2">Photo 3:2</option>
            <option value="2:3">Photo 2:3</option>
            <option value="custom">Personalizado</option>
          </select>
        </div>

        <!-- Ratio Inputs with Swap Button -->
        <div class="inputs-grid-wrapper">
          <div class="inputs-row">
            <div>
              <label for="ratioWidth" class="form-label">Width (ratio)</label>
              <input type="number" id="ratioWidth" class="input-field" value="9" min="0.01" step="any">
            </div>
            <div>
              <label for="ratioHeight" class="form-label">Height (ratio)</label>
              <input type="number" id="ratioHeight" class="input-field" value="16" min="0.01" step="any">
            </div>
          </div>

          <!-- Swap Button: Horizontal <-> Vertical -->
          <div class="swap-button-container">
            <button id="btnSwap" class="btn-swap" type="button" title="Intercambiar Horizontal ⇄ Vertical">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
              </svg>
              <span>Intercambiar H ⇄ V</span>
            </button>
          </div>

          <!-- Pixel Inputs -->
          <div class="inputs-row">
            <div>
              <label for="pixelWidth" class="form-label">Width (pixels)</label>
              <input type="number" id="pixelWidth" class="input-field" value="1280" min="1" step="1">
            </div>
            <div>
              <label for="pixelHeight" class="form-label">Height (pixels)</label>
              <input type="text" id="pixelHeight" class="input-field" value="2275.56">
            </div>
          </div>
        </div>

        <!-- Quick Resolution Chips -->
        <div>
          <span class="form-label">Presets Rápidos</span>
          <div class="quick-presets-chips">
            <button type="button" class="chip-btn chip-resolution" data-w="1080" data-h="1920" data-rw="9" data-rh="16">1080×1920</button>
            <button type="button" class="chip-btn chip-resolution" data-w="1920" data-h="1080" data-rw="16" data-rh="9">1920×1080</button>
            <button type="button" class="chip-btn chip-resolution" data-w="3840" data-h="2160" data-rw="16" data-rh="9">3840×2160</button>
            <button type="button" class="chip-btn chip-resolution" data-w="1080" data-h="1080" data-rw="1" data-rh="1">1080×1080</button>
            <button type="button" class="chip-btn chip-resolution" data-w="1080" data-h="1350" data-rw="4" data-rh="5">1080×1350</button>
            <button type="button" class="chip-btn chip-resolution" data-w="2560" data-h="1440" data-rw="16" data-rh="9">2560×1440</button>
          </div>
        </div>

      </section>

      <!-- Live Shape Visualizer Card -->
      <section class="visualizer-card">
        <div class="visualizer-header">
          <h2 class="visualizer-title">Live Shape Visualizer</h2>
          <p class="visualizer-subtitle">See how your calculated aspect ratio proportions look physically in real time:</p>
        </div>

        <!-- Stage Container -->
        <div id="visualizerStage" class="visualizer-stage">
          <div id="shapeBox" class="shape-box">
            <span id="shapeRatioText" class="shape-ratio-text">9:16 (0.56:1)</span>
            <span id="shapePxText" class="shape-px-text">1280 × 2276 px</span>
          </div>
        </div>

        <!-- Metrics & Actions Bar -->
        <div class="visualizer-actions-bar">
          <div class="metrics-pills">
            <div class="metric-badge">Ratio: <strong id="metricRatio">9:16</strong></div>
            <div class="metric-badge">Factor: <strong id="metricDecimal">0.563:1</strong></div>
            <div class="metric-badge"><strong id="metricOrientation">Vertical (Portrait)</strong></div>
          </div>

          <div class="copy-buttons-group">
            <button id="btnRoundEven" class="btn-secondary" type="button" title="Ajusta a números pares exactos">
              <span>Nº Pares</span>
            </button>
            <button id="btnCopyDimensions" class="btn-secondary" type="button" title="Copiar W×H">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copiar</span>
            </button>
            <button id="btnCopyCSS" class="btn-secondary" type="button" title="Copiar CSS aspect-ratio">
              <span>CSS</span>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="../../js/shared.js"></script>
  <script src="../../js/aspect-ratio.js"></script>
</body>
</html>
