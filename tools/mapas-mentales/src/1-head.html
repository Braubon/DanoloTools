<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mapas Mentales — DanoloTools</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: lienzo a pantalla completa; barra flotante arriba, zoom abajo a la izquierda, minimapa abajo a la derecha */
  --bg:#06070a;
  --panel:#0c0e15;
  --ink:#f8fafc;
  --muted:#94a3b8;
  --line:#1c2133;
  --accent:#00f0ff;
  --accent-soft:rgba(0,240,255,.16);
  --hover:rgba(255,255,255,.06);
  --dot:#1c2133;
  --danger:#ff007a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);
  --shadow-lg:0 12px 36px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.6);
  --node-shadow:0 1px 2px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.5);
  --font-ui:'Plus Jakarta Sans','Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Bricolage Grotesque','Syne',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ECEEF2;
  --panel:#FFFFFF;
  --ink:#1A1D23;
  --muted:#646B78;
  --line:#D9DDE4;
  --accent:#2D5BE3;
  --accent-soft:rgba(45,91,227,.13);
  --hover:rgba(26,29,35,.06);
  --dot:#C2C7D0;
  --danger:#C93434;
  --shadow-sm:0 1px 2px rgba(20,24,33,.06),0 2px 8px rgba(20,24,33,.06);
  --shadow-lg:0 10px 32px rgba(20,24,33,.18),0 2px 6px rgba(20,24,33,.08);
  --node-shadow:0 1px 2px rgba(20,24,33,.14),0 4px 14px rgba(20,24,33,.08);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#06070a;
  --panel:#0c0e15;
  --ink:#f8fafc;
  --muted:#94a3b8;
  --line:#1c2133;
  --accent:#00f0ff;
  --accent-soft:rgba(0,240,255,.16);
  --hover:rgba(255,255,255,.06);
  --dot:#1c2133;
  --danger:#ff007a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);
  --shadow-lg:0 12px 36px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.6);
  --node-shadow:0 1px 2px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Lienzo ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px);background-size:24px 24px}
#viewport.grid-on{background-image:linear-gradient(var(--dot) 1px,transparent 1px),linear-gradient(90deg,var(--dot) 1px,transparent 1px)}
#viewport.panning{cursor:grabbing}
#viewport.linking,#viewport.linking *{cursor:crosshair!important}
.layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#edges{pointer-events:none}
#overlay{pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#nodes,#labels{position:absolute;left:0;top:0}

.eline{fill:none;stroke:var(--ec);stroke-linecap:round;stroke-linejoin:round}
.earrow{fill:var(--ec)}
.ehit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.edge:hover .eline{filter:drop-shadow(0 0 2px var(--accent-soft))}
.edge.sel .eline{stroke:var(--accent)}
.edge.sel .earrow{fill:var(--accent)}
.edge.dim{opacity:.18}
.elabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;
  font:600 12px/1 var(--font-ui);padding:4px 8px;border-radius:7px;background:var(--panel);color:var(--ink);border:1.5px solid var(--ec);user-select:none}
.elabel.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.elabel.dim{opacity:.2}
#templink{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.ghost{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.ghost-plus{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.guide{stroke:#E5484D;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
#selrect{position:absolute;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:4px;pointer-events:none}

/* ---------- Cuadros ---------- */
.node{position:absolute;left:0;top:0;min-width:140px;width:max-content;border-radius:14px;background:var(--c);color:var(--t);
  box-shadow:var(--node-shadow);user-select:none;-webkit-user-select:none;pointer-events:auto;transition:box-shadow .15s,opacity .2s}
.nhead{display:flex;align-items:center;gap:1px;height:28px;padding:0 4px 0 8px;background:var(--h);color:var(--ht);border-radius:14px 14px 0 0;cursor:grab}
#viewport.dragging .nhead{cursor:grabbing}
.grip{flex:1;align-self:stretch;min-width:18px;display:flex;align-items:center}
.grip::before{content:'';width:8px;height:14px;opacity:.5;background-image:radial-gradient(circle,currentColor 1.1px,transparent 1.5px);background-size:4px 4.7px}
.tchip .x svg.i{width:12px;height:12px}
.nb{display:grid;place-items:center;width:26px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:inherit;opacity:.82;cursor:pointer}
.nb:hover,.nb:focus-visible{opacity:1;background:rgba(0,0,0,.14)}
.nb svg.i{width:15px;height:15px;stroke-width:2}
.nb-col{display:none}
.node.has-kids .nb-col{display:grid}
.node.collapsed .nb-col svg{transform:rotate(-90deg)}
.nbody{padding:12px 16px 13px;cursor:crosshair}
.ntext{line-height:1.25;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:1.25em;font-weight:500}
.ntext:empty::before{content:'Sin texto';opacity:.45}
.node.editing .nbody{cursor:text}
.node.editing .ntext{user-select:text;-webkit-user-select:text;cursor:text;border-radius:6px;box-shadow:0 0 0 2px var(--accent);background:rgba(255,255,255,.28)}
.ntags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.ntag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 5px;border-radius:999px;background:var(--tagbg);font-size:10.5px;font-weight:600;line-height:14px;white-space:nowrap}
.ntag i{width:7px;height:7px;border-radius:50%;background:var(--tc);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.node.sel{box-shadow:0 0 0 2.5px var(--accent),var(--node-shadow)}
.node.link-target{box-shadow:0 0 0 3px var(--accent),0 0 0 9px var(--accent-soft)}
.node.dim{opacity:.2}
.node.hit{box-shadow:0 0 0 3px #F5A623,var(--node-shadow)}
.node.hit.cur{box-shadow:0 0 0 3px #F5A623,0 0 0 10px rgba(245,166,35,.3)}
.nbadge{position:absolute;right:-9px;bottom:-9px;display:none;min-width:28px;height:22px;padding:0 7px;border-radius:999px;border:1.5px solid var(--h);background:var(--panel);color:var(--ink);font:700 11px/1 var(--font-ui);cursor:pointer;box-shadow:var(--shadow-sm)}
.node.collapsed .nbadge{display:block}
@media (pointer:coarse){
  .node{min-width:160px}
  .nhead{height:34px}
  .nb{width:32px;height:30px}
  .nb svg.i{width:17px;height:17px}
}

/* ---------- Barra de herramientas ---------- */
.toolbar{position:fixed;top:10px;left:10px;right:10px;z-index:30;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.tb-group{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
.tb-title{min-width:0;flex:0 1 auto;padding-right:10px}
.tb-tools{min-width:0;flex:0 1 auto;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tb-tools::-webkit-scrollbar{display:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.ibtn{position:relative;display:grid;place-items:center;flex:none;width:36px;height:36px;padding:0;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer}
.ibtn:hover{background:var(--hover)}
.ibtn:disabled{opacity:.35;cursor:default;background:transparent}
.ibtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ibtn .dotbadge{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.title-wrap{display:flex;flex-direction:column;min-width:0;padding-left:4px}
.map-title{border:0;background:transparent;padding:0;text-align:left;cursor:text;font:700 16px/1.2 var(--font-display);letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.map-title-input{font:700 16px/1.2 var(--font-display);border:1.5px solid var(--accent);border-radius:6px;padding:1px 4px;background:var(--panel);width:min(34vw,280px)}
.savestate{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}

.zoomctl{position:fixed;left:10px;bottom:10px;z-index:30}
.zoomlbl{min-width:52px;height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.zoomlbl:hover{background:var(--hover)}
#minimap{position:fixed;right:10px;bottom:10px;z-index:30;width:200px;height:130px;padding:0;overflow:hidden;cursor:pointer}
#minimap canvas{width:100%;height:100%;display:block;touch-action:none}

#filterchip{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:30;pointer-events:auto;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
#filterchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#filterchip button{border:0;border-radius:999px;padding:5px 10px;background:rgba(127,127,127,.3);color:inherit;cursor:pointer;font-weight:600;flex:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:29;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;max-width:min(720px,calc(100vw - 440px));font-size:13px;color:var(--muted)}
#hint b{color:var(--ink);font-weight:600}
#hint .ibtn{width:28px;height:28px}

#searchbar{position:fixed;top:64px;right:10px;z-index:31;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;width:min(380px,calc(100vw - 20px))}
#searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:34px;font-size:15px}
#scount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Paneles emergentes ---------- */
#pop{position:fixed;z-index:50;width:300px;max-height:min(76vh,640px);overflow:auto;padding:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overscroll-behavior:contain}
#pop.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-height:70vh;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#pop.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
.pop-h{font:700 15px/1.2 var(--font-display);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.pop-h small{font:500 12px var(--font-ui);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.mini-h{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--sw);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative;display:grid;place-items:center;font-size:11px;font-weight:700}
.sw.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw-custom{background:conic-gradient(#E5484D,#FFC53D,#46A758,#12A594,#0090FF,#6E56CF,#D6409F,#E5484D);overflow:hidden}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.sw-auto{background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:9px;background:var(--hover)}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:var(--shadow-sm);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06070a}
:root[data-theme="light"] .btn.primary{color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06070a}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px}
.fsout{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pop-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.pop-actions .btn{width:100%}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 -6px 10px}
.menu button,.menu label.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:9px;background:transparent;cursor:pointer;text-align:left}
.menu button:hover,.menu label.mi:hover{background:var(--hover)}
.menu .mi-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.menu .mi-t b{font-weight:600;font-size:14px}
.menu .mi-t small{color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(14px)}
.note{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.linkbtn{border:0;background:none;color:var(--accent);padding:4px 0;cursor:pointer;font-weight:600;font-size:13px}
.textin{width:100%;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:14px}
.textin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (pointer:coarse){.textin,#searchbar input,.map-title-input{font-size:16px}}

/* Etiquetas */
.tagchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500}
.tchip i{width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.tchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.tchip .x{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;opacity:.6}
.tchip .x:hover{opacity:1;background:var(--hover)}
.tchip.add{padding:0 10px}
.sugg{display:flex;flex-direction:column;margin-top:4px}
.sugg button{display:flex;align-items:center;gap:8px;padding:7px 8px;border:0;background:transparent;border-radius:7px;text-align:left;cursor:pointer}
.sugg button i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.sugg button.act,.sugg button:hover{background:var(--hover)}
.empty{color:var(--muted);font-size:13px}

/* ---------- Paneles laterales ---------- */
.side{position:fixed;top:0;bottom:0;z-index:40;width:min(340px,92vw);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.side.left{left:0;border-radius:0 16px 16px 0}
.side.right{right:0;border-radius:16px 0 0 16px}
.side header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 18px}
.side h2{margin:0;font:700 20px/1.2 var(--font-display);letter-spacing:-.01em}
.side .scroll{flex:1;overflow:auto;padding:0 12px 12px;overscroll-behavior:contain}
.side footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.syncdot.ok{background:#46A758}.syncdot.sync{background:#FFC53D}.syncdot.error,.syncdot.offline{background:#E5484D}
.dr-actions{display:flex;gap:6px;padding:0 6px 12px}
.dr-actions .btn{flex:1}
.maplist,.taglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mapitem{display:flex;align-items:center;gap:2px;border-radius:10px;padding:2px}
.mapitem:hover{background:var(--hover)}
.mapitem.cur{background:var(--accent-soft)}
.mapopen{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:8px}
.mapopen b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapopen small{color:var(--muted);font-size:12px}
.mapitem .ibtn{width:32px;height:32px;opacity:.7}
.mapitem .ibtn:hover{opacity:1}
.mapitem .ibtn svg.i{width:16px;height:16px}
.confirm-inline{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:13px}
.tagrow{display:flex;align-items:center;gap:4px;padding:3px;border-radius:10px}
.tagrow:hover{background:var(--hover)}
.tagrow .tchip{flex:1;justify-content:flex-start;height:34px;border-color:transparent;background:transparent}
.tagrow .tchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tagrow .tchip em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:6px}
.tagrow .ibtn{width:32px;height:32px}
.tagrow .ibtn svg.i{width:16px;height:16px}
.tagcolor{width:18px;height:18px;border-radius:50%;background:var(--tc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tagedit{padding:6px 8px 10px 12px;display:flex;flex-direction:column;gap:8px}
.tp-top{padding:0 6px 12px;display:flex;flex-direction:column;gap:8px}
.newtag{display:flex;gap:6px;padding:10px 6px 0}

/* ---------- Diálogos y avisos ---------- */
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,12,16,.45)}
.dialog{width:min(560px,100%);max-height:min(86vh,760px);overflow:auto;background:var(--panel);color:var(--ink);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px}
.dialog h2{margin:0 0 6px;font:700 20px/1.2 var(--font-display);text-wrap:balance}
.dialog p{line-height:1.5;margin:6px 0 12px;color:var(--muted)}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dialog textarea{width:100%;min-height:200px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.keys{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 14px}
.keys td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.keys td:first-child{width:46%;color:var(--muted)}
kbd{font:600 11.5px var(--font-ui);padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.dialog h3{font:700 14px var(--font-display);margin:16px 0 4px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 4px}

@media (max-width:700px){
  .toolbar{top:calc(8px + env(safe-area-inset-top));left:8px;right:8px}
  .tb-title{max-width:calc(100vw - 112px)}
  .map-title,.savestate{max-width:calc(100vw - 180px)}
  .tb-tools{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));margin:0;justify-content:space-between}
  .tb-tools .sep{display:none}
  .tb-tools .ibtn{width:34px;height:40px}
  .zoomctl{left:auto;right:8px;bottom:auto;top:calc(8px + env(safe-area-inset-top))}
  .zoomctl #btn-zout,.zoomctl #btn-zin,.zoomctl .zoomlbl{display:none}
  .zoomctl .ibtn{width:38px;height:38px}
  #hint{display:none}
  #minimap{width:150px;height:100px;bottom:calc(66px + env(safe-area-inset-bottom))}
  #filterchip{bottom:calc(66px + env(safe-area-inset-bottom))}
  #toasts{bottom:calc(116px + env(safe-area-inset-bottom))}
  #searchbar{top:calc(62px + env(safe-area-inset-top));right:8px;width:calc(100vw - 16px)}
}
@media (max-width:370px){.tb-tools .ibtn{width:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
