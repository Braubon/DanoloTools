<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanoloTools</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06070a;
      --surface: #0c0e15;
      --border: #1c2133;
      --border-hover: #2b324d;
      --cyan: #00f0ff;
      --cyan-glow: rgba(0,240,255,.15);
      --text: #f8fafc;
      --muted: #57637a;
      --secondary: #94a3b8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: .05em;
      flex-shrink: 0;
    }
    .brand span { color: var(--cyan); }

    .search {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .5rem .75rem;
      max-width: 320px;
      width: 100%;
    }
    .search:focus-within { border-color: var(--cyan); }
    .search svg { color: var(--muted); flex-shrink: 0; }
    .search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: .9rem;
      width: 100%;
    }
    .search input::placeholder { color: var(--muted); }

    main {
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: .75rem;
    }

    .tool-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: .95rem;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .tool-link:hover {
      border-color: var(--cyan);
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--cyan-glow), inset 0 0 20px var(--cyan-glow);
    }
    .tool-link .arrow {
      color: var(--muted);
      flex-shrink: 0;
      transition: color .15s, transform .15s;
    }
    .tool-link:hover .arrow {
      color: var(--cyan);
      transform: translateX(2px);
    }

    .tool-desc {
      display: block;
      font-size: .78rem;
      font-weight: 400;
      color: var(--secondary);
      margin-top: .2rem;
    }

    .tool-name-wrap { min-width: 0; }

    #status {
      color: var(--muted);
      font-size: .85rem;
      padding: 2rem 0;
      text-align: center;
    }

    @media (max-width: 600px) {
      header { padding: 1rem; }
      main { padding: 1rem; }
      .brand { font-size: .85rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">DANOLO<span>//</span>TOOLS</a>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="q" placeholder="Buscar... (⌘K)" autocomplete="off">
    </div>
  </header>

  <main>
    <div id="grid"><p id="status">Cargando herramientas…</p></div>
  </main>

  <script>
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('q');
    let allTools = [];

    async function loadTools() {
      try {
        const res = await fetch('/api/tools');
        allTools = await res.json();
        renderTools(allTools);
      } catch {
        grid.innerHTML = '<p id="status">No se pudieron cargar las herramientas.</p>';
      }
    }

    function renderTools(tools) {
      if (!tools.length) {
        grid.innerHTML = '<p id="status">No hay herramientas disponibles.</p>';
        return;
      }
      grid.innerHTML = tools.map(t => `
        <a href="tools/${t.folder}/index.html" class="tool-link" data-name="${t.name.toLowerCase()} ${t.folder}">
          <div class="tool-name-wrap">
            <span>${t.name}</span>
            ${t.desc ? `<span class="tool-desc">${t.desc}</span>` : ''}
          </div>
          <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      `).join('');
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = !q ? allTools : allTools.filter(t =>
        t.name.toLowerCase().includes(q) || t.folder.includes(q) || (t.desc || '').toLowerCase().includes(q)
      );
      renderTools(filtered);
    });

    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    loadTools();
  </script>
</body>
</html>
